name: DreamFit
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  DEVELOPMENT_TEAM: SJRM8TVZYF
  CODE_SIGN_STYLE: Automatic
targets:
  DreamFit:
    type: application
    platform: iOS
    bundleId: com.drmhse.dream.fit
    productName: Dream Fit
    sources:
      - Sources
      - Assets.xcassets
    entitlements:
      path: DreamFit.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleName: Dream Fit
        CFBundleDisplayName: Dream Fit
        UIRequiredDeviceCapabilities: [arm64, bluetooth-le]
        NSBluetoothAlwaysUsageDescription: Scan for Pixel Watch bridge service
        NSHealthShareUsageDescription: Save heart rate and steps from your Pixel Watch
        NSHealthUpdateUsageDescription: Save heart rate and steps from your Pixel Watch
        UIBackgroundModes: [bluetooth-central]
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.drmhse.dream.fit
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
schemes:
  DreamFit:
    build:
      targets:
        DreamFit: all
    run:
      config: Debug
