<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:617px;height:517px;background:#FFFFFF;" width="617px" height="517px" viewBox="0 0 617 517" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="93.329" y="22.32" fill="#1C1C1E" font-size="16" textLength="424.07" font-weight="700" font-family="Helvetica">One measurement, from published once to written once</text></g><!--entity HS--><g class="entity" data-qualified-name="HS" id="ent0001" data-source-line="8"><rect x="345.31" y="44" width="162.102" height="56" fill="#F2F2F7" style="stroke:#C7C7CC;stroke-width:1;" rx="5" ry="5"/><text x="355.31" y="63.24" fill="#6E6E73" font-size="12" textLength="84.035" font-family="Helvetica">Health Services</text><text x="355.31" y="75.24" fill="#6E6E73" font-size="12" textLength="142.102" font-family="Helvetica">publishes each point once,</text><text x="355.31" y="87.24" fill="#6E6E73" font-size="12" textLength="87.381" font-family="Helvetica">keeps no history</text></g><!--entity LOG--><g class="entity" data-qualified-name="LOG" id="ent0002" data-source-line="9"><rect x="340.63" y="154" width="171.453" height="44" fill="#EAF8EF" style="stroke:#1DA34A;stroke-width:1;" rx="5" ry="5"/><text x="350.63" y="173.24" fill="#1C1C1E" font-size="12" textLength="51.369" font-family="Helvetica">deltas.log</text><text x="350.63" y="185.24" fill="#1C1C1E" font-size="12" textLength="151.453" font-family="Helvetica">append before anything else</text></g><!--entity WIN--><g class="entity" data-qualified-name="WIN" id="ent0003" data-source-line="10"><rect x="272.99" y="252" width="132.729" height="44" fill="#EAF8EF" style="stroke:#1DA34A;stroke-width:1;" rx="5" ry="5"/><text x="282.99" y="271.24" fill="#1C1C1E" font-size="12" textLength="63.375" font-family="Helvetica">one window</text><text x="282.99" y="283.24" fill="#1C1C1E" font-size="12" textLength="112.729" font-family="Helvetica">64 messages in flight</text></g><!--entity UNW--><g class="entity" data-qualified-name="UNW" id="ent0004" data-source-line="11"><rect x="165.99" y="350" width="150.74" height="44" fill="#EAF2FC" style="stroke:#0A6ED1;stroke-width:1;" rx="5" ry="5"/><text x="175.99" y="369.24" fill="#1C1C1E" font-size="12" textLength="48.691" font-family="Helvetica">unwritten</text><text x="175.99" y="381.24" fill="#1C1C1E" font-size="12" textLength="130.74" font-family="Helvetica">kept until Health accepts</text></g><!--entity HK--><g class="entity" data-qualified-name="HK" id="ent0005" data-source-line="12"><rect x="7" y="459" width="88.713" height="32" fill="#F2F2F7" style="stroke:#C7C7CC;stroke-width:1;" rx="5" ry="5"/><text x="17" y="478.24" fill="#6E6E73" font-size="12" textLength="68.713" font-family="Helvetica">Apple Health</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="20"><path d="M423.98,263 L423.98,285 A5,5 0 0 0 428.98,290 L597.729,290 A5,5 0 0 0 602.729,285 L602.729,268 L592.729,258 L428.98,258 A5,5 0 0 0 423.98,263" style="stroke:#B26A00;stroke-width:0.5;" fill="#FFF6E5"/><path d="M592.729,258 L592.729,265.5 A2.5,2.5 0 0 0 595.229,268 L602.729,268 L592.729,258" style="stroke:#B26A00;stroke-width:1;" fill="#FFF6E5"/><text x="429.98" y="271.47" fill="#1C1C1E" font-size="11" textLength="157.749" font-family="Helvetica">Survives the process, the reboot</text><text x="429.98" y="282.47" fill="#1C1C1E" font-size="11" textLength="156.551" font-family="Helvetica">and a day with nobody listening.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="25"><path d="M335.05,361 L335.05,383 A5,5 0 0 0 340.05,388 L532.657,388 A5,5 0 0 0 537.657,383 L537.657,366 L527.657,356 L340.05,356 A5,5 0 0 0 335.05,361" style="stroke:#B26A00;stroke-width:0.5;" fill="#FFF6E5"/><path d="M527.657,356 L527.657,363.5 A2.5,2.5 0 0 0 530.157,366 L537.657,366 L527.657,356" style="stroke:#B26A00;stroke-width:1;" fill="#FFF6E5"/><text x="341.05" y="369.47" fill="#1C1C1E" font-size="11" textLength="181.607" font-family="Helvetica">A window is forgotten only on a clean</text><text x="341.05" y="380.47" fill="#1C1C1E" font-size="11" textLength="173.637" font-family="Helvetica">flush. A discard puts it back in front.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="30"><path d="M336.48,464 L336.48,486 A5,5 0 0 0 341.48,491 L521.24,491 A5,5 0 0 0 526.24,486 L526.24,469 L516.24,459 L341.48,459 A5,5 0 0 0 336.48,464" style="stroke:#B26A00;stroke-width:0.5;" fill="#FFF6E5"/><path d="M516.24,459 L516.24,466.5 A2.5,2.5 0 0 0 518.74,469 L526.24,469 L516.24,459" style="stroke:#B26A00;stroke-width:1;" fill="#FFF6E5"/><text x="342.48" y="472.47" fill="#1C1C1E" font-size="11" textLength="168.76" font-family="Helvetica">The watch has already forgotten it,</text><text x="342.48" y="483.47" fill="#1C1C1E" font-size="11" textLength="165.698" font-family="Helvetica">so a sealed store must not drop it.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="35"><path d="M113.84,453 L113.84,471 L96.15,475 L113.84,479 L113.84,497 A5,5 0 0 0 118.84,502 L313.881,502 A5,5 0 0 0 318.881,497 L318.881,458 L308.881,448 L118.84,448 A5,5 0 0 0 113.84,453" style="stroke:#B26A00;stroke-width:0.5;" fill="#FFF6E5"/><path d="M308.881,448 L308.881,455.5 A2.5,2.5 0 0 0 311.381,458 L318.881,458 L308.881,448" style="stroke:#B26A00;stroke-width:0.5;" fill="#FFF6E5"/><text x="119.84" y="461.47" fill="#1C1C1E" font-size="11" textLength="184.041" font-family="Helvetica">The daily absolute never arrives here.</text><text x="119.84" y="472.47" fill="#1C1C1E" font-size="11" textLength="168.153" font-family="Helvetica">It drives the screens and the audit,</text><text x="119.84" y="483.47" fill="#1C1C1E" font-size="11" textLength="162.647" font-family="Helvetica">and having it write too is what put</text><text x="119.84" y="494.47" fill="#1C1C1E" font-size="11" textLength="117.385" font-family="Helvetica">the same steps in twice.</text></g><!--link HS to LOG--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M426.36,100.33 C426.36,117.09 426.36,133.23 426.36,148.74" style="stroke:#1DA34A;stroke-width:1;" fill="none" id="HS-to-LOG"/><polygon points="426.36,153.74,430.36,144.74,426.36,148.74,422.36,144.74,426.36,153.74" fill="#1DA34A" style="stroke:#1DA34A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="434.383" y="124.47" fill="#6E6E73" font-size="11" textLength="100.257" font-weight="700" font-family="Helvetica">cannot be re-asked</text><text x="427.36" y="135.47" fill="#6E6E73" font-size="11" textLength="114.302" font-family="Helvetica">so this write comes first</text></g><!--link LOG to WIN--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M396.48,198.2 C390.85,202.78 385.21,207.82 380.36,213 C369.4,224.69 361.862,235.305 354.392,247.305" style="stroke:#1DA34A;stroke-width:1;" fill="none" id="LOG-to-WIN"/><polygon points="351.75,251.55,359.902,246.023,354.392,247.305,353.11,241.796,351.75,251.55" fill="#1DA34A" style="stroke:#1DA34A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="381.36" y="222.47" fill="#6E6E73" font-size="11" textLength="117.96" font-weight="700" font-family="Helvetica">confirmed, or returned</text><text x="390.51" y="233.47" fill="#6E6E73" font-size="11" textLength="99.661" font-family="Helvetica">the radio says which</text></g><!--link WIN to UNW--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M281.24,296.47 C274.65,300.58 268.48,305.39 263.36,311 C253.56,321.73 249.219,332.333 246.149,344.873" style="stroke:#0A6ED1;stroke-width:1;" fill="none" id="WIN-to-UNW"/><polygon points="244.96,349.73,250.985,341.939,246.149,344.873,243.215,340.037,244.96,349.73" fill="#0A6ED1" style="stroke:#0A6ED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="298.152" y="320.47" fill="#6E6E73" font-size="11" textLength="67.853" font-weight="700" font-family="Helvetica">at-least-once</text><text x="264.36" y="331.47" fill="#6E6E73" font-size="11" textLength="135.438" font-family="Helvetica">kind + exact span is the key</text></g><!--link UNW to HK--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="17" data-link-type="dependency"><path d="M201.06,394.42 C164.9,413.64 117.105,439.053 84.865,456.193" style="stroke:#0A6ED1;stroke-width:1;" fill="none" id="UNW-to-HK"/><polygon points="80.45,458.54,90.274,457.847,84.865,456.193,86.519,450.783,80.45,458.54" fill="#0A6ED1" style="stroke:#0A6ED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.98" y="418.47" fill="#6E6E73" font-size="11" textLength="64.786" font-weight="700" font-family="Helvetica">written once</text><text x="169.96" y="429.47" fill="#6E6E73" font-size="11" textLength="138.827" font-family="Helvetica">over the span it happened in</text></g><!--link LOG to GMN10--><g class="link" data-entity-1="ent0002" data-entity-2="ent0011" id="lnk12" data-source-line="20" data-link-type="association"><path d="M483.2,198.42 C489.28,202.53 494.88,207.36 499.36,213 C509.46,225.73 512.5,244.5 513.31,257.64" style="stroke:#6E6E73;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="LOG-GMN10"/></g><!--link WIN to GMN13--><g class="link" data-entity-1="ent0003" data-entity-2="ent0014" id="lnk15" data-source-line="25" data-link-type="association"><path d="M385.77,296.29 C392.47,300.58 398.93,305.48 404.36,311 C416.94,323.79 425.87,342.54 431.04,355.67" style="stroke:#6E6E73;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="WIN-GMN13"/></g><!--link UNW